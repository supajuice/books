<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Supa Juice books</title>
  <meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111111'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial,sans-serif' font-weight='700' font-size='26' fill='%23ffffff'%3ER%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="books.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="topbar-inner">
      <div class="topbar-row">
        <h1 class="wordmark" id="brand">Supa Juice books</h1>
        <button type="button" class="btn btn-quiet btn-small" id="lock">Lock</button>
      </div>
      <nav class="tabs" aria-label="Sections">
        <button type="button" class="tab" data-tab="add">Add</button>
        <button type="button" class="tab" data-tab="ledger">Ledger</button>
        <button type="button" class="tab" data-tab="report">Report</button>
        <button type="button" class="tab" data-tab="settings">Settings</button>
      </nav>
    </div>
  </header>

  <main class="page page--wide" id="main">
    <p id="loading" class="fine" role="status">Loading the books&hellip;</p>

    <section id="login" class="stack-lg" hidden>
      <div>
        <h1 class="wordmark">Supa Juice books</h1>
        <p class="lede">Money in and money out. Open the private link you were given, or paste the books key.</p>
      </div>
      <form id="login-form" class="stack" novalidate>
        <div class="field">
          <label for="key">Books key</label>
          <input id="key" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
          <p class="hint">It stays on this phone.</p>
        </div>
        <div class="alert alert-bad" id="login-error" role="alert" hidden></div>
        <button type="submit" class="btn btn-primary btn-block">Open the books</button>
      </form>
    </section>

    <section id="load-error" class="stack" hidden>
      <h2 class="section-title">The books did not load</h2>
      <p id="load-error-text"></p>
      <button type="button" class="btn btn-primary" id="load-retry">Try again</button>
    </section>

    <section id="panel-add" class="stack-lg" hidden></section>
    <section id="panel-ledger" class="stack-lg" hidden></section>
    <section id="panel-report" class="stack-lg" hidden></section>
    <section id="panel-settings" class="stack-lg" hidden></section>
  </main>

  <script src="config.js"></script>
  <script src="books.js"></script>
</body>
</html>
